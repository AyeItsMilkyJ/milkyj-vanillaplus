
[general]
	#Enable wild spawning of revived creatures
	enableWildSpawn = true
	#Spawn check interval in ticks (400 = 20 sec)
	#Range: 20 ~ 6000
	spawnCheckInterval = 400

[groupSize]
	#Min group size
	#Range: 1 ~ 10
	groupMin = 1
	#Max group size
	#Range: 1 ~ 20
	groupMax = 3

[spawnDistance]
	#Min spawn distance from player (blocks)
	#Range: 8 ~ 128
	minSpawnDistance = 24
	#Max spawn distance from player (blocks)
	#Range: 16 ~ 256
	maxSpawnDistance = 64
	#Max number of revived creatures allowed near a player at once (within spawn range + 32 blocks). New spawns are skipped above this limit.
	#Range: 1 ~ 100
	maxNearbyDinos = 8

